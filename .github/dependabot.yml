# Dependabot: Go module requirements, GitHub Actions (pinned by SHA), the container base image and the union catalog
# generator's hash-pinned Python requirements (scripts/requirements.txt, #92).
# Dependabot does not bump the go.mod `toolchain` directive
# (https://github.com/dependabot/dependabot-core/issues/13520, open as of 2026-09-25);
# .github/workflows/go-toolchain.yml covers it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  # The container image's base (packaging/Dockerfile), pinned by digest (#122).
  - package-ecosystem: docker
    directory: /packaging
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
