# golangci-lint v2 configuration.
# Encodes .claude/rules/go.md (security, body-close, context checks, no disabled TLS verification)
# and the package dependency direction of .claude/rules/project-structure.md (ADR-0009):
#
#   cmd -> transport -> server -> workflows -> langfuse -> trust
#                              \-> catalog      \-> sanitize
#   config is imported only by cmd; only server and transport import the MCP SDK.
#
# Requires a golangci-lint binary built with Go >= 1.27 (the module's go version).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # every HTTP response body is closed
    - contextcheck # functions receive the caller's context
    - noctx # no HTTP request or exec without a context
    - gosec # security checks (G402 flags InsecureSkipVerify / weak TLS versions)
    - forbidigo # explicit bans below
    - depguard # dependency direction below
  settings:
    forbidigo:
      forbid:
        - pattern: ^InsecureSkipVerify$
          msg: "TLS verification must never be disabled (.claude/rules/security.md, ADR-0006)"
        - pattern: ^http\.DefaultClient$
          msg: "use the one shared, tuned *http.Client (.claude/rules/go.md)"
    depguard:
      rules:
        # Production code never shells out and never uses unsafe (.claude/rules/go.md).
        # Tests may re-execute the test binary as a child process (spec #7, seam S2).
        no-exec-or-unsafe:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: "no os/exec in production code (.claude/rules/go.md)"
            - pkg: unsafe
              desc: "no unsafe (.claude/rules/go.md)"
        # Only server and transport import the MCP SDK.
        mcp-sdk-only-in-server-and-transport:
          files:
            - "$all"
            - "!**/internal/server/**"
            - "!**/internal/transport/**"
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: "only server and transport import the MCP SDK (ADR-0009)"
        # Per module: deny every internal import except the edges drawn in project-structure.md.
        # list-mode lax: a more specific allow entry wins over the internal/ deny. Each module is
        # allowed itself (and its subpackages) so external _test packages can import it.
        # config is in no allow list, so only cmd (which has no rule here) imports it.
        # trust is the lowest module.
        trust:
          list-mode: lax
          files:
            - "**/internal/trust/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/trust
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "trust may import nothing internal (project-structure.md, ADR-0009)"
        # sanitize holds pure functions.
        sanitize:
          list-mode: lax
          files:
            - "**/internal/sanitize/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/sanitize
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "sanitize may import nothing internal (project-structure.md, ADR-0009)"
        # config only parses values; cmd wires them into modules.
        config:
          list-mode: lax
          files:
            - "**/internal/config/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/config
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "config may import nothing internal (project-structure.md, ADR-0009)"
        # catalog is pure data (its spec/ subpackage is part of it).
        catalog:
          list-mode: lax
          files:
            - "**/internal/catalog/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/catalog
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "catalog may import nothing internal (project-structure.md, ADR-0009)"
        # langfuse knows HTTP, not MCP.
        langfuse:
          list-mode: lax
          files:
            - "**/internal/langfuse/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/langfuse
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/trust
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "langfuse may import trust (project-structure.md, ADR-0009)"
        # workflows know nothing about MCP registration.
        workflows:
          list-mode: lax
          files:
            - "**/internal/workflows/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/workflows
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/langfuse
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/sanitize
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "workflows may import langfuse, sanitize (project-structure.md, ADR-0009)"
        # server wraps executor results (sanitize) and translates langfuse errors (errors.md).
        server:
          list-mode: lax
          files:
            - "**/internal/server/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/server
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/workflows
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/catalog
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/langfuse
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/sanitize
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "server may import workflows, catalog, langfuse, sanitize (project-structure.md, ADR-0009)"
        # transport starts the server over stdio or loopback HTTP.
        transport:
          list-mode: lax
          files:
            - "**/internal/transport/**"
          allow:
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/transport
            - github.com/rodrigorjsf/langfuse-api-mcp/internal/server
          deny:
            - pkg: github.com/rodrigorjsf/langfuse-api-mcp/internal/
              desc: "transport may import server (project-structure.md, ADR-0009)"

formatters:
  enable:
    - gofmt
    - goimports
