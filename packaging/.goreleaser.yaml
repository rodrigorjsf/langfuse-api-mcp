# GoReleaser (OSS) configuration: the single build driver of the release pipeline (spec #119).
# Run from the repository root, always with this file passed explicitly:
#   goreleaser release --snapshot --clean --config packaging/.goreleaser.yaml
# Pinned tool versions (supply chain, .claude/rules/security.md), bumped by hand:
#   GoReleaser v2.18.2 (OSS; the npm publisher is Pro-only and is not used)
#   syft v1.52.0 (SPDX JSON SBOM per archive; GoReleaser runs it from PATH)
# Both pins live in .github/workflows/release.yml; change them there together with this header.
# Nothing is published from here: `release` is disabled, and the workflow runs snapshot builds only
# (#126 wires signing, provenance and publishing, the image push included, to a `v*` tag).
version: 2

project_name: langfuse-mcp

builds:
  - id: langfuse-mcp
    main: ./cmd/langfuse-mcp
    binary: langfuse-mcp
    env:
      - CGO_ENABLED=0 # static binary; the server uses no cgo (.claude/rules/go.md)
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # main.version is what initialize and the startup log report (spec #119, seam S1).
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: the file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: langfuse-mcp
    ids: [langfuse-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# The container image (spec #119): distroless static, non-root, no shell, amd64 and arm64
# (packaging/Dockerfile). In snapshot mode GoReleaser builds one local image per platform, tagged
# <version>-amd64 and <version>-arm64, and pushes nothing; a non-snapshot run would build the
# multi-arch manifest and push it, which only a `v*` tag may do (#126). The image's SBOM is written
# by syft in the release workflow (SPDX JSON, like the archives'), so buildx attestations are off.
dockers_v2:
  - id: langfuse-mcp
    ids: [langfuse-mcp]
    dockerfile: packaging/Dockerfile
    images:
      - ghcr.io/rodrigorjsf/langfuse-api-mcp
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: "false"
    labels:
      org.opencontainers.image.source: https://github.com/rodrigorjsf/langfuse-api-mcp
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    # syft's default for GoReleaser is SPDX JSON: one <archive>.sbom.json per archive.
    documents:
      - "{{ .ArtifactName }}.sbom.json"

snapshot:
  # A SemVer pre-release derived from the commit (spec #119), e.g. 0.0.0-SNAPSHOT-0a1b2c3.
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true
