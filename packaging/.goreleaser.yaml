# GoReleaser (OSS) configuration: the single build driver of the release pipeline (spec #119).
# Run from the repository root, always with this file passed explicitly:
#   goreleaser release --snapshot --clean --config packaging/.goreleaser.yaml
# Pinned tool versions (supply chain, .claude/rules/security.md), bumped by hand:
#   GoReleaser v2.18.2 (OSS; the npm publisher is Pro-only and is not used)
#   syft v1.52.0 (SPDX JSON SBOM per archive; GoReleaser runs it from PATH)
# Both pins live in .github/workflows/release.yml; change them there together with this header.
# Nothing is published from here: GoReleaser only builds. `release` is disabled and the workflow
# always runs it with --snapshot; on a `v*` tag the version comes from the tag (RELEASE_VERSION,
# below), and the workflow's tag-only jobs sign, attest and publish exactly the files and images the
# smoke tested (#126). A non-snapshot run is not used: with publishing skipped, dockers_v2 builds no
# image at all, and with publishing on it would push an image before any smoke ran.
version: 2

project_name: langfuse-mcp

builds:
  - id: langfuse-mcp
    main: ./cmd/langfuse-mcp
    binary: langfuse-mcp
    env:
      - CGO_ENABLED=0 # static binary; the server uses no cgo (.claude/rules/go.md)
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # main.version is what initialize and the startup log report (spec #119, seam S1).
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: the file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

# The universal macOS binary (amd64+arm64) exists for the MCPB bundle only (spec #119): one
# bundle serves both Mac architectures because its platform_overrides are keyed by OS. The
# per-architecture darwin binaries stay (`replace: false`) and keep feeding the archives and the
# image; nothing below selects this id, so it is neither archived nor checksummed.
# scripts/pack-mcpb.sh finds it in dist/artifacts.json by this id.
universal_binaries:
  - id: langfuse-mcp-macos-universal
    ids: [langfuse-mcp]
    name_template: langfuse-mcp
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: langfuse-mcp
    ids: [langfuse-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# The container image (spec #119): distroless static, non-root, no shell, amd64 and arm64
# (packaging/Dockerfile). In snapshot mode GoReleaser builds one local image per platform, tagged
# <version>-amd64 and <version>-arm64, and pushes nothing; on a `v*` tag the workflow's
# publish-image job pushes both and joins them into the multi-arch image (#126). The image's SBOM is written
# by syft in the release workflow (SPDX JSON, like the archives'), so buildx attestations are off.
dockers_v2:
  - id: langfuse-mcp
    ids: [langfuse-mcp]
    dockerfile: packaging/Dockerfile
    images:
      - ghcr.io/rodrigorjsf/langfuse-api-mcp
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: "false"
    labels:
      org.opencontainers.image.source: https://github.com/rodrigorjsf/langfuse-api-mcp
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    # syft's default for GoReleaser is SPDX JSON: one <archive>.sbom.json per archive.
    documents:
      - "{{ .ArtifactName }}.sbom.json"

snapshot:
  # A SemVer pre-release derived from the commit (spec #119), e.g. 0.0.0-SNAPSHOT-0a1b2c3; on a `v*`
  # tag the workflow sets RELEASE_VERSION to the tag without its `v` (e.g. 1.2.3). Leave it unset
  # otherwise: an empty value is an error, not the snapshot version.
  version_template: '{{ envOrDefault "RELEASE_VERSION" (printf "0.0.0-SNAPSHOT-%s" .ShortCommit) }}'

changelog:
  disable: true

release:
  disable: true
