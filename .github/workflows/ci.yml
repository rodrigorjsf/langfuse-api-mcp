# CI: build, vet, lint and race-enabled tests on Linux, macOS and Windows, plus govulncheck.
# The test step also runs the cross-OS trust proof against a throwaway CA installed in each
# runner's system trust store (spec #7).
# The generator job runs the union catalog generator's offline unit tests (#89).
# Actions are pinned by commit SHA; Dependabot (.github/dependabot.yml) keeps them current.
# A push or pull request that only changes docs (Markdown, docs/, .claude/, LICENSE) starts no run:
# nothing in those paths is compiled or embedded (the only go:embed is internal/catalog/spec/*.json).
name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # go + toolchain directives pick the exact toolchain
          cache-dependency-path: go.mod
      - name: Build (no cgo)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Build golangci-lint with the module's toolchain: a binary built with an older Go
          # refuses to lint a go 1.27 module.
          install-mode: goinstall
      # Cross-OS trust proof (spec #7, ADR-0006): install a throwaway "OS" test CA into this
      # ephemeral runner's system trust store, so cmd/langfuse-mcp's trust test can prove the
      # executable trusts it together with an SSL_CERT_FILE CA. Never done on developer machines.
      # macOS/Windows install steps are unverified until the first CI run (see #27).
      - name: Generate the OS test CA
        shell: bash
        run: go run ./scripts/gen-os-test-ca "$RUNNER_TEMP/os-test-ca"
      - name: Install the OS test CA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo cp "$RUNNER_TEMP/os-test-ca/ca.pem" /usr/local/share/ca-certificates/langfuse-mcp-os-test-ca.crt
          sudo update-ca-certificates
      - name: Install the OS test CA (macOS)
        if: runner.os == 'macOS'
        run: sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/os-test-ca/ca.pem"
      - name: Install the OS test CA (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: certutil -addstore -f Root "$env:RUNNER_TEMP\os-test-ca\ca.pem"
      # Windows only: a Go runtime bug (golang/go#81238, not fixed in any release yet) corrupts a
      # goroutine stack on AMX Intel runners of the windows-latest pool, so the test binary dies
      # with a runtime fatal error for any commit. Retry once, and only when the log carries that
      # crash signature; a real test failure still fails the first attempt. Remove with #102.
      - name: Test (race detector)
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/go-test.log"
          if go test -race -count=1 ./... 2>&1 | tee "$log"; then exit 0; fi
          if [ "$RUNNER_OS" = "Windows" ] &&
            grep -qE 'fatal error: (unknown caller pc|fault)|unexpected return pc' "$log"; then
            echo "::warning::Go runtime crash on a Windows runner (golang/go#81238, #102); retrying once"
            go test -race -count=1 ./...
          else
            exit 1
          fi
        env:
          LANGFUSE_MCP_TEST_OS_CA_DIR: ${{ runner.temp }}/os-test-ca

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Offline unit tests of the union catalog generator (#81, #89): a cyclic, malformed or foreign
  # $ref and a non-JSON request body must stop generation. Linux only; the tests fetch nothing.
  # This job never regenerates the catalog: that needs every release spec over the network and
  # stays in the weekly .github/workflows/union-catalog.yml (ADR-0012).
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Supply chain (security.md): PyYAML is the generator's only dependency (it parses the
      # release specs), so the tests cannot import the generator without it. Installed from the
      # hash-checked scripts/requirements.txt, shared with union-catalog.yml (#92).
      - name: Install the generator's dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r scripts/requirements.txt
      - name: Test the generator
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" scripts/test_gen_union_catalog.py
      # The small-model eval's offline matcher tests (#105): standard library only, no model.
      - name: Test the small-model eval matcher
        run: |
          set -euo pipefail
          python3 scripts/test_small_model_eval.py
      # The eval's Ollama stack takes OLLAMA_KV_CACHE_TYPE from the caller's environment; a typo in
      # the compose file or its interpolation fails here, not at the next hand-run eval. Parse only:
      # nothing is pulled or started (the stack needs an NVIDIA GPU that runners lack).
      - name: Validate the small-model eval compose file
        run: |
          set -euo pipefail
          docker compose -f scripts/small-model-eval-ollama.yml config --quiet
          OLLAMA_KV_CACHE_TYPE=q8_0 docker compose -f scripts/small-model-eval-ollama.yml config \
            | grep -q 'OLLAMA_KV_CACHE_TYPE: q8_0'
